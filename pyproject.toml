[project]
name = "pm-micro"
version = "0.1.0"
description = "Cross-venue microstructure analysis of Kalshi and Polymarket prediction markets."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "kalshi-python>=2.1.0",
    "py-clob-client>=0.15.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "nbformat>=5.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.5",
    "websockets>=16.0",
    "cryptography>=48.0.0",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_micro"]
